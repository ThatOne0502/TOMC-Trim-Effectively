# TODO: 按需调整内存/并行配置。configuration-cache=false 是 loom 已知 issue #1349 的官方示例做法。
org.gradle.jvmargs=-Xmx2G -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.configuration-cache=false

# 本机默认 JAVA_HOME 指向 JDK 8（那是给 1.7.10/1.12.2 老线用的），
# 1.21.11 需要 JDK 21，所以在这里钉死 Gradle 守护进程用的 JDK。
#
# 这一行是**本机路径**，公开仓库里不写死：Gradle 自身要求 JVM 17+（编译目标是 21，由下面的
# toolchain 负责 provision），而很多机器 PATH 上的 java 仍是 8。请按自己的环境二选一：
#   ① 把 JAVA_HOME 指向 JDK 21；或
#   ② 取消下面这行的注释并改成你自己的 JDK 路径，或每次构建加参数
#      -Dorg.gradle.java.home="C:\\path\\to\\jdk-21"
# 注意：这是「启动 Gradle 的那个 JVM」，与 java.toolchain 的 21 是两件事。
# org.gradle.java.home=C\:\\Program Files\\Java\\jdk-21.0.5+11

minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.17.19
fabric_api_version=0.141.6+1.21.11

version=0.1.0
group=io.github.thatone0502.trimeffectively
